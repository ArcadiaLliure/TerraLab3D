<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
      .sphere-bg { fill: radial-gradient(circle, #1e293b 0%, #090d16 100%); }
      .sphere-line { fill: none; stroke: #334155; stroke-width: 1.5; stroke-dasharray: 4,4; }
      .horizon-plane { fill: rgba(16, 185, 129, 0.08); stroke: #10b981; stroke-width: 2; }
      .equator-plane { fill: rgba(56, 189, 248, 0.08); stroke: #38bdf8; stroke-width: 2; stroke-dasharray: 6,4; }
      .meridian-line { fill: none; stroke: #fbbf24; stroke-width: 2; }
      .axis-line { fill: none; stroke: #cbd5e1; stroke-width: 2; stroke-linecap: round; }
      .star-vector { fill: none; stroke: #f43f5e; stroke-width: 2.5; }
      .label-main { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; }
      .label-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94a3b8; }
      .box { fill: rgba(15, 23, 42, 0.85); stroke: #334155; stroke-width: 1; rx: 6px; }
      .formula-box { fill: #1e293b; stroke: #475569; stroke-width: 1; rx: 8px; }
      .formula-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; }
      .formula-math { font-family: "Courier New", Courier, monospace; font-size: 13px; font-weight: 600; fill: #f8fafc; }
    </style>
  </defs>

  <!-- Fons de la làmina -->
  <rect width="900" height="520" class="bg" rx="12"/>

  <!-- Capçalera -->
  <text x="36" y="38" class="title">Esfera Celeste, Temps Sideral (LST) i Coordenades</text>
  <text x="36" y="58" class="subtitle">Relació geomètrica entre el pla horitzontal de l'observador i el sistema equatorial</text>

  <!-- Esfera celeste 3D projecció -->
  <g transform="translate(260, 290)">
    <!-- Cercle exterior de l'esfera -->
    <circle cx="0" cy="0" r="180" fill="#090d16" stroke="#475569" stroke-width="2"/>

    <!-- Pla de l'horitzó local (El·lipse verda) -->
    <ellipse cx="0" cy="0" rx="180" ry="50" class="horizon-plane"/>
    <text x="135" y="-12" fill="#10b981" class="label-main">Horitzó local (0°)</text>
    <text x="-170" y="8" fill="#10b981" class="label-sub">Nord (N)</text>
    <text x="145" y="8" fill="#10b981" class="label-sub">Sud (S)</text>

    <!-- Pla de l'Equador Celeste (El·lipse blava inclinada per la latitud) -->
    <g transform="rotate(-35)">
      <ellipse cx="0" cy="0" rx="180" ry="45" class="equator-plane"/>
      <line x1="0" y1="-180" x2="0" y2="180" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="100" y="-10" fill="#38bdf8" class="label-main">Equador celeste</text>
    </g>

    <!-- Eix del Món / Pol Celeste Nord (NCP) -->
    <g transform="rotate(55)">
      <line x1="0" y1="-210" x2="0" y2="210" stroke="#f8fafc" stroke-width="2.5"/>
      <polygon points="0,-218 -6,-204 6,-204" fill="#f8fafc"/>
      <text x="12" y="-200" fill="#f8fafc" class="label-main" transform="rotate(-55 12 -200)">Pol Nord Celeste (NCP)</text>
      <text x="12" y="-185" fill="#94a3b8" class="label-sub" transform="rotate(-55 12 -185)">Alt = Latitud (φ)</text>
    </g>

    <!-- Zenit de l'observador (Z) -->
    <line x1="0" y1="0" x2="0" y2="-210" stroke="#fbbf24" stroke-width="2"/>
    <polygon points="0,-218 -6,-204 6,-204" fill="#fbbf24"/>
    <text x="12" y="-202" fill="#fbbf24" class="label-main">Zenit (Z · +90°)</text>

    <!-- Meridià local de l'observador (arc daurat) -->
    <path d="M 0,-180 A 180 180 0 0 1 0,180" class="meridian-line"/>
    <text x="-120" y="-100" fill="#fbbf24" class="label-main">Meridià local</text>

    <!-- Posició d'un astre d'exemple (Star) -->
    <circle cx="65" cy="-85" r="5" fill="#f43f5e"/>
    <line x1="0" y1="0" x2="65" y2="-85" class="star-vector"/>
    <text x="76" y="-85" fill="#f43f5e" class="label-main">Astre (α, δ)</text>

    <!-- Centre (Observador) -->
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
    <text x="8" y="16" fill="#f8fafc" class="label-sub">Observador</text>
  </g>

  <!-- Panell lateral dret amb formulació matemàtica -->
  <g transform="translate(560, 85)">
    <!-- Caixa 1: Temps Sideral i Angle Horari -->
    <rect width="305" height="185" class="formula-box"/>
    <text x="16" y="26" class="formula-title">Temps Sideral i Angle Horari</text>
    
    <text x="16" y="52" fill="#94a3b8" class="label-sub">Angle horari (HA) de l'astre:</text>
    <text x="16" y="74" class="formula-math">HA = LST - RA</text>
    
    <text x="16" y="102" fill="#94a3b8" class="label-sub">Temps sideral local (LST):</text>
    <text x="16" y="122" class="formula-math">LST = GMST + Longitud / 15°</text>

    <text x="16" y="148" fill="#94a3b8" class="label-sub">Condició de culminació al meridià:</text>
    <text x="16" y="168" class="formula-math">HA = 0h ⟹ RA = LST</text>

    <!-- Caixa 2: Conversió Equatorial -> Horitzontal -->
    <rect y="200" width="305" height="195" class="formula-box"/>
    <text x="16" y="226" class="formula-title">Equatorial ➔ Horitzontal (Az, Alt)</text>
    
    <text x="16" y="250" fill="#94a3b8" class="label-sub">Altitud geomètrica (h):</text>
    <text x="16" y="270" class="formula-math">sin h = sin φ sin δ + cos φ cos δ cos HA</text>
    
    <text x="16" y="298" fill="#94a3b8" class="label-sub">Azimut astronòmic (A):</text>
    <text x="16" y="318" class="formula-math">cos A = (sin δ - sin φ sin h) / (cos φ cos h)</text>
    <text x="16" y="338" class="formula-math">sin A = - (cos δ sin HA) / cos h</text>

    <text x="16" y="368" fill="#64748b" class="label-sub">φ: latitud · δ: declinació · α (RA): ascensió recta</text>
  </g>

  <!-- Peu d'esquema -->
  <text x="36" y="495" fill="#64748b" class="label-sub">TerraLab3D · Formulació canònica de mecànica celeste topocèntrica segons les recomanacions IAU / IERS</text>
</svg>
