[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terralab3d-core"
version = "0.1.0"
description = "Scientific, application and scene contracts for TerraLab3D"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "skyfield==1.55",
    "skyfield-data==7.0.0",
    "spiceypy==7.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
