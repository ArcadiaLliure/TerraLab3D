[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terralab3d-core"
version = "0.1.0"
description = "Scientific, application and scene contracts for TerraLab3D"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "astropy>=6.1",
    "hpgeom>=1.3",
    "numpy>=2.0",
    "skyfield==1.55",
    "skyfield-data==7.0.0",
    "spiceypy==7.0.0",
    "Pillow>=10",
    "rasterio>=1.4",
    "pyproj>=3.7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
pythonPath = "C:\\Users\\Manel\\AppData\\Local\\Programs\\Python\\Python313\\python.exe"
pythonVersion = "3.13"
extraPaths = ["src"]

