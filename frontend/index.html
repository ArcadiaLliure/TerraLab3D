<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TerraLab3D</title>
  <meta name="description" content="TerraLab3D — Scientific astronomical terrain viewer">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #02040a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    #scene-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #scene-container canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div id="scene-container"></div>
  <script type="module" src="/bundle.js"></script>
  <link rel="stylesheet" href="/bundle.css">
</body>
</html>
